[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.1.0"
description = "Extensible asynchronous chatbot skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
chatbot = "app.main:run"
chatbot-replay = "app.tools.chat_replay:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
